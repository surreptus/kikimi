# Builds the website (site/) and publishes it to GitHub Pages. Needs Pages switched on once:
# Settings > Pages > Source: GitHub Actions.
# On a pull request it only builds, so a broken site is found before the merge; it has no path filter, so it always runs
# and can be a required check (a filtered check that doesn't run would block the merge for ever). Only a push to main deploys.
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', 'Kikimi/Privacy.md', 'Kikimi/Terms.md', 'CHANGELOG.md', '.github/workflows/site.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A pull request's build must not cancel a deploy that is running, or the other way round.
  group: ${{ github.event_name == 'pull_request' && format('site-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
